<nav class="top-bar">
   <a href="/" class="site-logo-left">{{ site.title }}</a>
   <div class="nav-right">
      {% include nav.html %}
   </div>
</nav>

{% if page.title == "Home" or page.title == "Tags" %}
    <header class="header-home">
        <h1 class="title">{{ site.title }}</h1>
        <h2 class="description">{{ site.bio }}</h2>
        {% include social-links.html %}
    </header>
{% endif %}

{% if page.title != "Home" %}
<div class="page-title-center">
    <h1>{{ page.title }}</h1>
</div>
{% endif %}
